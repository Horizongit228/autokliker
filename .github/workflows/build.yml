name: Build APK
on: [workflow_dispatch, push]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore persistent APK signing key
        env:
          AUTOCLICK_SIGNING_KEY: ${{ secrets.AUTOCLICK_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$AUTOCLICK_SIGNING_KEY" ]; then
            echo "::error::Set repository Actions secret AUTOCLICK_SIGNING_KEY first. Refusing to generate a different signing key."
            exit 1
          fi
          umask 077
          key_path="$RUNNER_TEMP/autoclickx-signing.keystore"
          printf '%s' "$AUTOCLICK_SIGNING_KEY" | base64 --decode > "$key_path"
          keytool -list -keystore "$key_path" -storepass android -alias androiddebugkey >/dev/null
          expected=$(keytool -exportcert -keystore "$key_path" -storepass android -alias androiddebugkey | sha256sum | cut -d' ' -f1)
          echo "AUTOCLICK_KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"
          echo "AUTOCLICK_EXPECTED_CERT=$expected" >> "$GITHUB_ENV"
          echo "Persistent certificate SHA-256: $expected"
          if [ "$expected" != "9e243cbca746446e906f805b3f2adc220bbad71305de7fb333233ca84d50a3da" ]; then
            echo "::warning::The saved key is not the certificate of v0.3. Updates over v0.3 may require reinstall."
          fi
      - run: gradle :app:clean :app:assembleDebug --no-daemon --no-build-cache --stacktrace
      - name: Verify APK signature
        run: |
          set -euo pipefail
          result=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk)
          printf '%s\n' "$result"
          actual=$(printf '%s\n' "$result" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          if [ "$actual" != "$AUTOCLICK_EXPECTED_CERT" ]; then
            echo "::error::APK certificate differs from the persistent signing key."
            exit 1
          fi
          echo "Persistent signing certificate verified."
      - uses: actions/upload-artifact@v4
        with:
          name: AutoClickX-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/autoclickx-signing.keystore"
