name: Build APK
on: [workflow_dispatch, push]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore persistent APK signing key
        env:
          AUTOCLICK_SIGNING_KEY: ${{ secrets.AUTOCLICK_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$AUTOCLICK_SIGNING_KEY" ]; then
            echo "::error::Set repository Actions secret AUTOCLICK_SIGNING_KEY first. Refusing to generate a different signing key."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.android"
          printf '%s' "$AUTOCLICK_SIGNING_KEY" | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
      - run: gradle assembleDebug --no-daemon --stacktrace
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AutoClickX-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
