plugins { id 'com.android.application' }
android {
 namespace 'com.autoclickx.app'
 compileSdk 34
 defaultConfig {
  applicationId 'com.autoclickx.app'
  minSdk 24
  targetSdk 34
  versionCode 5
  versionName '0.4.1'
 }
 signingConfigs {
  debug {
   def stableKey = System.getenv('AUTOCLICK_KEYSTORE_PATH')
   if (stableKey != null && !stableKey.isEmpty()) {
    storeFile file(stableKey)
    storePassword 'android'
    keyAlias 'androiddebugkey'
    keyPassword 'android'
   } else if (System.getenv('CI') == 'true') {
    throw new GradleException('Persistent signing key path missing in CI')
   }
  }
 }
 buildTypes { debug { signingConfig signingConfigs.debug } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
